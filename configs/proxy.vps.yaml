listeners:
  - address: ":443"
    tls:
      cert_file: /etc/goproxy/tls/fullchain.pem
      key_file: /etc/goproxy/tls/privkey.pem

admin:
  address: "127.0.0.1:9090"
  auth_token_env: GOPROXY_ADMIN_TOKEN

routes:
  - name: app
    host: example.com
    path_prefix: /
    pool: app
    strategy: round_robin
    cache:
      enabled: false
    policy:
      allowed_methods:
        - GET
        - HEAD
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      denied_path_prefixes:
        - /internal
        - /debug
      required_headers: []
      denied_headers:
        - X-Debug-Bypass
      max_query_bytes: 4096
    rate_limit:
      enabled: true
      requests: 300
      window: 1m
      max_keys: 10000

pools:
  app:
    backends:
      - name: app-1
        url: http://127.0.0.1:3000
    health:
      path: /health
      interval: 5s
      timeout: 1s
      unhealthy_threshold: 2
      healthy_threshold: 1
    retry:
      max_attempts: 2

timeouts:
  read_header: 10s
  read_body: 30s
  write: 2m
  idle: 60s
  shutdown: 30s
  dial: 5s
  response_header: 30s

limits:
  max_header_bytes: 16384
  max_body_bytes: 10485760
  max_concurrent_requests: 1024
  max_connections: 4096

# Leave client_ip unset when Gefahr receives traffic directly from clients.
# If a trusted reverse proxy or load balancer is in front of Gefahr, configure
# both trusted_proxies and the exact sanitized headers that proxy sets.
# client_ip:
#   trusted_proxies:
#     - 203.0.113.10/32
#   headers:
#     - X-Forwarded-For

cache:
  max_entries: 1000
  max_bytes: 67108864
  default_ttl: 30s

logging:
  level: info
