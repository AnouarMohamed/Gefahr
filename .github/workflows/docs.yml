name: Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - "gefahr-docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "gefahr-docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gefahr-docs/package-lock.json
      - name: Install dependencies
        working-directory: gefahr-docs
        run: npm ci
      - name: Build
        working-directory: gefahr-docs
        run: npm run build
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: gefahr-docs/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
